<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registermaschine IDE</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components/menubar/menubar.css">
    <link rel="stylesheet" href="components/cards/cards.css">
    <link rel="stylesheet" href="components/editor/editor.css">
    <link rel="stylesheet" href="components/layout/layout.css">

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

        require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" } });

<div id="topbar">
    <div class="menu-item" id="fileMenu">
